<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · SENSUS</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3EEE3">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@72,800&family=Instrument+Sans:wght@400;600&family=Instrument+Serif:ital@1&display=swap">
<style>
:root{--ink:#141513;--paper:#F3EEE3;--mute:#6B675E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:var(--paper);color:var(--ink);font:400 17px/1.6 "Instrument Sans",system-ui,sans-serif}
main{max-width:560px}
.k{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:0 0 20px}
h1{margin:0 0 18px;font-family:Archivo,system-ui,sans-serif;font-weight:800;font-stretch:72%;font-size:clamp(40px,8vw,72px);line-height:.95;letter-spacing:-.02em}
h1 i{font-family:"Instrument Serif",serif;font-weight:400}
p{margin:0 0 28px;color:var(--mute)}
nav{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.btn{display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600;padding:14px 24px;border-radius:999px}
.lnk{color:var(--ink);font-weight:600;text-underline-offset:4px}
</style>
</head>
<body>
<main>
  <p class="k">Erreur 404</p>
  <h1>Ce moment-là <i>n’existe pas.</i></h1>
  <p>La page demandée est introuvable ou a été déplacée. Tout le reste est sur la page d’accueil.</p>
  <nav>
    <a class="btn" href="/">Retour à l’accueil</a>
    <a class="lnk" href="/#devis">Demander un devis</a>
  </nav>
</main>
</body>
</html>
